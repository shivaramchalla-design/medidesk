{% extends "base.html" %}{% block body %}<h2>Users</h2>
{% for u in users %}<div class="card row"><span><b>{{ u.name }}</b> ({{ u.role }}{% if u.spec %}, {{ u.spec }}{% endif %})<br><span class="m">{{ u.email }}</span></span>
<form method="post" action="{{ url_for('toggle',uid=u.id) }}">{{ csrf_field() }}<button class="{{ 'd' if u.active else '' }}">{{ 'Deactivate' if u.active else 'Activate' }}</button></form></div>{% endfor %}
<div class="card"><h3>Add doctor</h3><form method="post">{{ csrf_field() }}<input name="name" placeholder="Name" required><input name="spec" placeholder="Specialty" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Temporary password (8+)" minlength="8" required><button>Add doctor</button></form></div>{% endblock %}
