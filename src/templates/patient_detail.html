{% extends "base.html" %}{% block body %}<h2>{{ p.name }}</h2><p class="m">Age {{ p.age }}. Phone {{ p.phone }}. This view is logged.</p>
{% for r in recs %}<div class="card"><b>{{ r.title }}</b><div class="m">{{ r.date }} by {{ r.doctor.name }}</div><p>{{ r.body }}</p></div>{% endfor %}
<div class="card"><h3>Add record</h3><form method="post">{{ csrf_field() }}<input name="title" placeholder="Title" required maxlength="80"><textarea name="text" rows="3" placeholder="Details" required maxlength="500"></textarea><button>Save record</button></form></div>{% endblock %}
